-- LocalScript: Sitthiporn.X Ultra Pro Board UI
local player = game.Players.LocalPlayer
local uis = game:GetService("UserInputService")
local runService = game:GetService("RunService")
local tweenService = game:GetService("TweenService")
local playerGui = player:WaitForChild("PlayerGui")
local soundService = game:GetService("SoundService")
local lighting = game:GetService("Lighting")

-- รอ Character
local character = player.Character or player.CharacterAdded:Wait()
local humanoid = character:WaitForChild("Humanoid")
local root = character:WaitForChild("HumanoidRootPart")

-- =================== ฟังก์ชัน Low / Clean Game ===================
local function enableLowMode()
    for _, obj in pairs(workspace:GetDescendants()) do
        if obj:IsA("ParticleEmitter") or obj:IsA("Beam") or obj:IsA("Fire") or obj:IsA("Smoke") then
            obj:Destroy()
        elseif obj:IsA("Decal") then
            obj:Destroy()
        elseif obj:IsA("SurfaceGui") then
            obj.Enabled = false
        end
    end
    for _, light in pairs(workspace:GetDescendants()) do
        if light:IsA("PointLight") or light:IsA("SpotLight") or light:IsA("SurfaceLight") then
            light.Enabled = false
        end
    end
    lighting.GlobalShadows = false
    lighting.FogEnd = 100000
    lighting.Brightness = 1
end

-- เรียก Low Mode อัตโนมัติ
enableLowMode()

-- =================== เสียงตอนเริ่ม ===================
local welcomeSound = Instance.new("Sound")
welcomeSound.SoundId = "rbxassetid://9118826950"
welcomeSound.Volume = 1
