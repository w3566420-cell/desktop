-- =================== Tabs ===================
local tabNames = {"Player","Movement","Misc"}
local tabs = {}
local contentFrames = {}

for i, name in ipairs(tabNames) do
    local tabBtn = Instance.new("TextButton")
    tabBtn.Size = UDim2.new(0.3,0,0.08,0)
    tabBtn.Position = UDim2.new((i-1)*0.33,0,0.12,0)
    tabBtn.Text = name
    tabBtn.Font = Enum.Font.GothamBold
    tabBtn.TextSize = 18
    tabBtn.BackgroundColor3 = Color3.fromRGB(0,60,0)
    tabBtn.TextColor3 = Color3.fromRGB(255,255,255)
    tabBtn.Parent = frame

    local content = Instance.new("Frame")
    content.Size = UDim2.new(0.95,0,0.65,0)
    content.Position = UDim2.new(0.025,0,0.22,0)
    content.BackgroundTransparency = 1
    content.Visible = (i==1)
    content.Parent = frame

    tabs[name] = tabBtn
    contentFrames[name] = content

    tabBtn.MouseButton1Click:Connect(function()
        for _,f in pairs(contentFrames) do f.Visible=false end
        content.Visible = true
    end)
end

-- =================== ฟังก์ชันสร้างปุ่ม Modern ===================
local function createButton(parent,text,pos)
    local btn = Instance.new("TextButton")
    btn.Size = UDim2.new(0.9,0,0.12,0)
    btn.Position = pos
    btn.BackgroundColor3 = Color3.fromRGB(0,120,0)
    btn.TextColor3 = Color3.fromRGB(255,255,255)
    btn.Font = Enum.Font.GothamBold
    btn.TextSize = 18
    btn.Text = text
    btn.Parent = parent
    btn.AutoButtonColor = true

    btn.MouseEnter:Connect(function()
        tweenService:Create(btn, TweenInfo.new(0.2), {BackgroundTransparency=0.3}):Play()
    end)
    btn.MouseLeave:Connect(function()
        tweenService:Create(btn, TweenInfo.new(0.2), {BackgroundTransparency=0.1}):Play()
    end)
    return btn
end

-- =================== สร้างปุ่มในแต่ละ Tab ===================
-- Player Tab
local flyBtn = createButton(contentFrames["Player"],"บิน",UDim2.new(0.05,0,0.05,0))
local speedBtn = createButton(contentFrames["Player"],"วิ่งเร็ว: ปิด",UDim2.new(0.05,0,0.22,0))
local godBtn = createButton(contentFrames["Player"],"อมตะ: ปิด",UDim2.new(0.05,0,0.39,0))
local invisBtn = createButton(contentFrames["Player"],"ล่องหน: ปิด",UDim2.new(0.05,0,0.56,0))

-- Movement Tab
local afkBtn = createButton(contentFrames["Movement"],"AFK: ปิด",UDim2.new(0.05,0,0.05,0))
local noclipBtn = createButton(contentFrames["Movement"],"ทะลุวัตถุ: ปิด",UDim2.new(0.05,0,0.22,0))

-- Misc Tab
local lowBtn = createButton(contentFrames["Misc"],"Low Mode",UDim2.new(0.05,0,0.05,0))

-- =================== ค่าสถานะ ===================
local flying, flySpeed = false, 120
local speedBoostActive, speedBoost = false, 120
local godMode = false
local invisible, afkMode, noClip = false, false, false

-- =================== ฟังก์ชันปุ่ม ===================
flyBtn.MouseButton1Click:Connect(function()
    flying = not flying
    humanoid.PlatformStand = flying
    flyBtn.Text = flying and "ปิดบิน" or "บิน"
end)
speedBtn.MouseButton1Click:Connect(function()
    speedBoostActive = not speedBoostActive
    humanoid.WalkSpeed = speedBoostActive and speedBoost or 16
    speedBtn.Text = speedBoostActive and "วิ่งเร็ว: เปิด" or "วิ่งเร็ว: ปิด"
end)
godBtn.MouseButton1Click:Connect(function()
    godMode = not godMode
    godBtn.Text = godMode and "อมตะ: เปิด" or "อมตะ: ปิด"
end)
invisBtn.MouseButton1Click:Connect(function()
    invisible = not invisible
    for _, part in pairs(character:GetDescendants()) do
        if part:IsA("BasePart") or part:IsA("Decal") then
            tweenService:Create(part,TweenInfo.new(0.5),{Transparency = invisible and 1 or 0}):Play()
        end
    end
    invisBtn.Text = invisible and "ล่องหน: เปิด" or "ล่องหน: ปิด"
end)
afkBtn.MouseButton1Click:Connect(function()
    afkMode = not afkMode
    humanoid.WalkSpeed = (afkMode and 0) or (speedBoostActive and speedBoost or 16)
    afkBtn.Text = afkMode and "AFK: เปิด" or "AFK: ปิด"
end)
noclipBtn.MouseButton1Click:Connect(function()
    noClip = not noClip
    noclipBtn.Text = noClip and "ทะลุวัตถุ: เปิด" or "ทะลุวัตถุ: ปิด"
end)
lowBtn.MouseButton1Click:Connect(function()
    enableLowMode()
end)

-- =================== การเคลื่อนที่ ===================
runService.RenderStepped:Connect(function()
    -- Fly
    if flying then
        local moveDir = Vector3.new()
        if uis:IsKeyDown(Enum.KeyCode.W) then moveDir += workspace.CurrentCamera.CFrame.LookVector end
        if uis:IsKeyDown(Enum.KeyCode.S) then moveDir -= workspace.CurrentCamera.CFrame.LookVector end
        if uis:IsKeyDown(Enum.KeyCode.A) then moveDir -= workspace.CurrentCamera.CFrame.RightVector end
        if uis:IsKeyDown(Enum.KeyCode.D) then moveDir += workspace.CurrentCamera.CFrame.RightVector end
        if uis:IsKeyDown(Enum.KeyCode.Space) then moveDir += Vector3.new(0,1,0) end
        if uis:IsKeyDown(Enum.KeyCode.LeftShift) then moveDir -= Vector3.new(0,1,0) end
        if moveDir.Magnitude > 0 then moveDir = moveDir.Unit end
        root.Velocity = moveDir * flySpeed
    end

    -- GodMode
    if godMode then humanoid.Health = humanoid.MaxHealth end

    -- NoClip
    for _, part in pairs(character:GetDescendants()) do
        if part:IsA("BasePart") then
            part.CanCollide = not noClip
        end
    end
end)
